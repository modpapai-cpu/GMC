<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23050505'/%3E%3Ctext x='32' y='45' text-anchor='middle' font-family='Arial' font-size='42' font-weight='900' fill='%23ff1010'%3EG%3C/text%3E%3C/svg%3E">
<title>GMC — Products</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            background: #050505;
            color: white;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* ================= BACKGROUND ================= */

        .background {
            position: fixed;
            inset: 0;
            z-index: -10;
            overflow: hidden;

            background:
                radial-gradient(
                    circle at 15% 15%,
                    rgba(255,0,0,.13),
                    transparent 28%
                ),
                radial-gradient(
                    circle at 85% 80%,
                    rgba(255,0,0,.10),
                    transparent 30%
                ),
                #050505;
        }

        .grid {
            position: absolute;
            inset: 0;
            opacity: .17;

            background-image:
                linear-gradient(
                    rgba(255,255,255,.025) 1px,
                    transparent 1px
                ),
                linear-gradient(
                    90deg,
                    rgba(255,255,255,.025) 1px,
                    transparent 1px
                );

            background-size: 50px 50px;
        }

        .glow {
            position: absolute;
            width: 300px;
            height: 300px;
            border-radius: 50%;
            background: red;
            filter: blur(150px);
            opacity: .11;
        }

        .glow.one {
            top: 10%;
            left: 5%;
        }

        .glow.two {
            right: 5%;
            bottom: 10%;
        }

        /* ================= NAVBAR ================= */

        nav {
            position: fixed;
            top: 0;
            left: 0;

            width: 100%;
            height: 78px;

            padding: 0 7%;

            display: flex;
            align-items: center;
            justify-content: space-between;

            z-index: 1000;

            background: rgba(5,5,5,.75);
            backdrop-filter: blur(18px);

            border-bottom: 1px solid rgba(255,0,0,.15);
        }

        .logo {
            color: white;
            text-decoration: none;

            font-size: 21px;
            font-weight: 1000;

            letter-spacing: 1.5px;
            white-space: nowrap;
        }

        .logo span {
            color: #ff1111;

            text-shadow:
                0 0 8px red,
                0 0 20px rgba(255,0,0,.7);
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 27px;
        }

        .nav-links a {
            position: relative;

            color: #999;
            text-decoration: none;

            font-size: 12px;
            font-weight: 800;

            transition: .3s;
        }

        .nav-links a:hover,
        .nav-links a.active {
            color: white;
        }

        
.admin-link{width:25px;height:25px;display:inline-flex!important;align-items:center;justify-content:center}
.admin-link::after{display:none!important}
.admin-link svg{width:17px;height:17px;fill:none;stroke:#ff1717;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 0 5px rgba(255,0,0,.45));transition:.3s}
.admin-link:hover svg{transform:scale(1.12);filter:drop-shadow(0 0 9px rgba(255,0,0,.8))}

        .nav-links a::after {
            content: "";

            position: absolute;
            left: 0;
            bottom: -8px;

            width: 0;
            height: 2px;

            background: #ff1111;
            box-shadow: 0 0 10px red;

            transition: .3s;
        }

        .nav-links a:hover::after,
        .nav-links a.active::after {
            width: 100%;
        }

        /* ================= HEADER ================= */

        .page-header {
            padding: 150px 7% 70px;
            text-align: center;

            animation: pageIn 1s ease;
        }

        @keyframes pageIn {
            from {
                opacity: 0;
                transform: translateY(30px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .badge {
            display: inline-block;

            padding: 8px 15px;

            border-radius: 50px;

            color: #ff3030;

            border: 1px solid rgba(255,0,0,.25);

            background: rgba(255,0,0,.06);

            font-size: 10px;
            font-weight: 900;

            letter-spacing: 1.5px;

            margin-bottom: 20px;
        }

        .page-header h1 {
            font-size: clamp(45px, 7vw, 75px);
            font-weight: 1000;
            letter-spacing: -3px;
        }

        .page-header h1 span {
            color: #ff1717;

            text-shadow:
                0 0 15px rgba(255,0,0,.6),
                0 0 40px rgba(255,0,0,.2);
        }

        .page-header p {
            color: #666;

            max-width: 600px;
            margin: 18px auto 0;

            font-size: 13px;
            line-height: 1.7;
        }

        /* ================= PRODUCT SEARCH ================= */

        .product-search {
            position: relative;
            width: min(620px, 92%);
            margin: 28px auto 0;
            display: flex;
            align-items: center;
            border: 1px solid rgba(255,0,0,.25);
            border-radius: 12px;
            background: rgba(8,8,8,.72);
            box-shadow: 0 0 28px rgba(255,0,0,.06), inset 0 0 20px rgba(255,0,0,.025);
            transition: .25s ease;
            overflow: hidden;
        }

        .product-search:focus-within {
            border-color: rgba(255,0,0,.65);
            box-shadow: 0 0 0 3px rgba(255,0,0,.06), 0 0 35px rgba(255,0,0,.12);
        }

        .search-icon {
            width: 46px;
            flex: 0 0 46px;
            text-align: center;
            color: #ff2525;
            font-size: 24px;
            line-height: 1;
            text-shadow: 0 0 10px rgba(255,0,0,.45);
            transform: rotate(-20deg);
        }

        .product-search input {
            width: 100%;
            padding: 15px 45px 15px 0;
            border: 0;
            outline: 0;
            background: transparent;
            color: #fff;
            font-size: 13px;
        }

        .product-search input::placeholder { color: #666; }
        .product-search input::-webkit-search-cancel-button { display: none; }

        #clearProductSearch {
            position: absolute;
            right: 9px;
            width: 30px;
            height: 30px;
            padding: 0;
            border: 1px solid transparent;
            border-radius: 50%;
            background: transparent;
            color: #777;
            font-size: 20px;
            line-height: 1;
            cursor: pointer;
            display: none;
        }

        #clearProductSearch:hover {
            color: #fff;
            background: rgba(255,0,0,.15);
            border-color: rgba(255,0,0,.35);
        }

        .search-status {
            min-height: 17px;
            margin-top: 10px;
            color: #777;
            font-size: 10px;
            letter-spacing: .4px;
        }

        .product-card.search-hidden {
            display: none !important;
        }

        .search-no-results {
            grid-column: 1 / -1;
            padding: 60px 20px;
            text-align: center;
            color: #666;
            border: 1px solid #1b1b1b;
            border-radius: 16px;
            background: rgba(255,0,0,.025);
        }

        .search-no-results strong {
            display: block;
            margin-bottom: 7px;
            color: #ff3030;
            font-size: 13px;
        }

        /* ================= PRODUCTS ================= */

        .products {
            width: 86%;
            max-width: 1250px;

            margin: auto;

            padding-bottom: 90px;

            display: grid;
            grid-template-columns: repeat(3, 1fr);

            gap: 22px;
        }

        /* ================= HOVER RAINBOW CARD ================= */

        @property --rainbow-angle {
            syntax: "<angle>";
            initial-value: 0deg;
            inherits: false;
        }

        .product-card {
            position: relative;

            padding: 28px;

            min-height: 420px;

            border-radius: 18px;

            /* normal GMC border */
            border: 1px solid #1d1d1d;

            background:
                linear-gradient(
                    145deg,
                    rgba(255,0,0,.055),
                    rgba(255,255,255,.02)
                ) padding-box;

            overflow: hidden;

            transition:
                transform .38s cubic-bezier(.2,.8,.2,1),
                box-shadow .38s ease,
                border-color .38s ease;

            animation: cardIn .7s ease backwards;

            z-index: 1;
        }

        /* Animated rainbow border lives around the card. */
        .product-card::after {
            content: "";
            position: absolute;
            inset: -4px;
            border-radius: 22px;
            padding: 4px;
            pointer-events: none;

            background: conic-gradient(
                from var(--rainbow-angle),
                #ff1717,
                #ff7a00,
                #ffe600,
                #2cff78,
                #00d9ff,
                #7c4dff,
                #ff2bd6,
                #ff1717
            );

            /* show only the outer 2px border */
            -webkit-mask:
                linear-gradient(#fff 0 0) content-box,
                linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;

            opacity: 0;
            transform: scale(.985);
            transition: opacity .25s ease, transform .35s ease;
            animation: rainbowRun 1.8s linear infinite paused;
        }

        @keyframes rainbowRun {
            to { --rainbow-angle: 360deg; }
        }

        .product-card:hover {
            transform: translateY(-10px) scale(1.025);

            /* rainbow border becomes visible on hover */
            border-color: transparent;

            background:
                linear-gradient(145deg, rgba(20,5,5,.98), rgba(5,5,5,.96)) padding-box,
                conic-gradient(
                    from var(--rainbow-angle),
                    #ff1717, #ff7a00, #ffe600, #2cff78,
                    #00d9ff, #7c4dff, #ff2bd6, #ff1717
                ) border-box;

            box-shadow:
                0 22px 55px rgba(255,0,0,.16),
                0 0 35px rgba(255,0,0,.10);

            z-index: 20;
        }

        .product-card:hover::after {
            opacity: 1;
            transform: scale(1);
            animation-play-state: running;
        }

        .product-card:nth-child(1) {
            animation-delay: .1s;
        }

        .product-card:nth-child(2) {
            animation-delay: .2s;
        }

        .product-card:nth-child(3) {
            animation-delay: .3s;
        }

        @keyframes cardIn {
            from {
                opacity: 0;
                transform: translateY(35px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .product-card::before {
            content: "";

            position: absolute;

            width: 180px;
            height: 180px;

            top: -100px;
            right: -100px;

            background: red;

            filter: blur(100px);

            opacity: .08;

            transition: .4s;
        }

        .product-card:hover::before {
            opacity: .20;
            filter: blur(90px);
        }

        /* ================= PRODUCT TOP ================= */

        .product-top {
            display: flex;
            align-items: center;
            justify-content: space-between;

            margin-bottom: 25px;
        }

        .product-icon {
            width: 55px;
            height: 55px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 14px;

            background: rgba(255,0,0,.07);

            border: 1px solid rgba(255,0,0,.18);

            font-size: 25px;

            box-shadow:
                0 0 25px rgba(255,0,0,.05);
        }

        .tag {
            padding: 6px 10px;

            border-radius: 20px;

            color: #ff3737;

            background: rgba(255,0,0,.06);

            border: 1px solid rgba(255,0,0,.2);

            font-size: 9px;
            font-weight: 900;
        }

        /* ================= PRODUCT INFO ================= */

        .product-card h2 {
            font-size: 22px;
            margin-bottom: 10px;
        }

        .product-description {
            color: #666;

            font-size: 12px;

            line-height: 1.7;

            min-height: 43px;

            margin-bottom: 22px;
        }

        /* ================= PRICES ================= */

        .pricing {
            padding: 17px 0;

            border-top: 1px solid #1c1c1c;
            border-bottom: 1px solid #1c1c1c;

            margin-bottom: 20px;
        }

        .pricing.image-content {
            min-height: 145px;
            padding: 10px 0;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .pricing.image-content img {
            display: block;
            width: 100%;
            max-width: 100%;
            height: 145px;
            object-fit: contain;
            border-radius: 8px;
        }


        .image-content img{cursor:zoom-in;transition:transform .25s ease,filter .25s ease}.image-content img:hover{transform:scale(1.025);filter:brightness(1.08)}
        .image-lightbox{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;padding:28px;background:rgba(0,0,0,.84);backdrop-filter:blur(12px);opacity:0;visibility:hidden;pointer-events:none;transition:opacity .2s ease,visibility .2s ease}.image-lightbox.open{opacity:1;visibility:visible;pointer-events:auto}.image-lightbox img{display:block;max-width:min(92vw,1400px);max-height:88vh;width:auto;height:auto;object-fit:contain;border:1px solid rgba(255,0,0,.5);border-radius:12px;box-shadow:0 0 35px rgba(255,0,0,.25),0 0 100px rgba(255,0,0,.12);transform:scale(.94);transition:transform .22s ease;cursor:zoom-out}.image-lightbox.open img{transform:scale(1)}.image-lightbox .close{position:absolute;top:20px;right:24px;width:42px;height:42px;border:1px solid rgba(255,0,0,.55);border-radius:50%;background:rgba(8,8,8,.9);color:#fff;font-size:22px;line-height:1;cursor:pointer}.image-lightbox .close:hover{background:#e50909;box-shadow:0 0 24px rgba(255,0,0,.35)}body.lightbox-open{overflow:hidden}

        .image-fallback {
            display: none;
            align-items: center;
            justify-content: center;
            width: 100%;
            min-height: 120px;
            color: #555;
            font-size: 10px;
            letter-spacing: 1px;
        }

        .price-row {
            display: flex;
            justify-content: space-between;
            align-items: center;

            padding: 7px 0;

            color: #aaa;

            font-size: 12px;
        }

        .price-row strong {
            color: white;
        }

        .price-row .price {
            color: #ff2525;

            font-size: 13px;
            font-weight: 900;
        }

        /* ================= BUTTON ================= */

        .product-buttons {
            display: grid;
            grid-template-columns: 1fr;
            gap: 8px;
        }

        .product-buttons.two {
            grid-template-columns: repeat(2, minmax(0, 1fr));
        }

        .buy-btn {
            width: 100%;

            display: flex;
            justify-content: center;
            align-items: center;

            min-height: 40px;
            padding: 13px 10px;

            border-radius: 8px;

            color: white;
            background: #e50909;

            border: 1px solid #ff2727;

            text-decoration: none;

            font-size: 11px;
            font-weight: 900;
            text-align: center;

            transition: .3s;
        }

        .buy-btn:hover {
            background: #ff1515;

            box-shadow:
                0 0 25px rgba(255,0,0,.35);

            transform: translateY(-2px);
        }

        /* ================= NOTE ================= */

        .notice {
            width: 86%;
            max-width: 1250px;

            margin: 0 auto 70px;

            padding: 20px 25px;

            border-radius: 12px;

            border: 1px solid rgba(255,0,0,.15);

            background: rgba(255,0,0,.035);

            color: #666;

            text-align: center;

            font-size: 11px;
            line-height: 1.7;
        }

        .notice strong {
            color: #ff2929;
        }

        /* ================= FOOTER ================= */

        footer {
            padding: 30px 7%;

            border-top: 1px solid #161616;

            display: flex;
            justify-content: space-between;
            align-items: center;

            color: #555;

            font-size: 11px;
        }

        footer strong {
            color: #ff2222;
        }

        /* ================= MOBILE ================= */

        @media(max-width: 950px) {

            .products {
                grid-template-columns: repeat(2, 1fr);
            }

            .hero-card {
                width: 100%;
            }
        }

        @media(max-width: 650px) {

            nav {
                padding: 0 5%;
            }

            .logo {
                font-size: 15px;
            }

            .nav-links {
                gap: 9px;
            }

            .nav-links a {
                font-size: 8px;
            }

            .page-header {
                padding-left: 5%;
                padding-right: 5%;
            }

            .page-header h1 {
                font-size: 48px;
            }

            .products {
                width: 90%;
                grid-template-columns: 1fr;
            }

            .notice {
                width: 90%;
            }

            footer {
                flex-direction: column;
                gap: 10px;
                text-align: center;
            }
        }
    </style>
</head>

<body>

    <!-- BACKGROUND -->

    <div class="background">

        <div class="grid"></div>

        <div class="glow one"></div>
        <div class="glow two"></div>

    </div>


    <!-- NAVBAR -->

    <nav>

        <a href="first.html" class="logo">
            GMC
        </a>

        <div class="nav-links">

            <a href="first.html">
                HOME
            </a>

            <a href="product.html" class="active">
                PRODUCTS
            </a>

            <a href="contact.html">
                CONTACT
            </a>

            <a href="admin.html" class="admin-link" aria-label="Admin Panel" title="Admin Panel">
    <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M12 3l7 3v5.5c0 4.7-3 8.1-7 9.5-4-1.4-7-4.8-7-9.5V6l7-3z"></path>
        <path d="M9.5 12l1.7 1.7 3.5-3.5"></path>
    </svg>
</a>

        </div>

    </nav>


    <!-- PAGE HEADER -->

    <header class="page-header">

        <div class="badge">
            GMC
        </div>

        <h1>
            OUR
            <span>PRODUCTS</span>
        </h1>

        <p>
            Explore the available GMC products
            and choose the plan that suits you.
        </p>

        <div class="product-search" role="search">
            <span class="search-icon" aria-hidden="true">⌕</span>
            <input id="productSearch" type="search" placeholder="Search products..."
                   autocomplete="off" aria-label="Search products">
            <button id="clearProductSearch" type="button" aria-label="Clear search">×</button>
        </div>
        <div id="searchStatus" class="search-status" aria-live="polite"></div>

    </header>


    <!-- PRODUCTS -->

    <section class="products" id="products-container">
        <div style="grid-column:1/-1;text-align:center;color:#666;padding:50px 0;">
            Loading products...
        </div>
    </section>


    <div class="image-lightbox" id="imageLightbox" aria-hidden="true"><button class="close" type="button" aria-label="Close image">&times;</button><img id="lightboxImage" src="" alt="Product preview"></div>

    <script>
    function escapeHtml(value) {
        return String(value ?? "")
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");
    }

    function getButtons(product) {
        if (Array.isArray(product.buttons) && product.buttons.length) {
            return product.buttons.slice(0, 2).map(button => ({
                text: String(button.text || "GET PRODUCT"),
                link: String(button.link || "#")
            }));
        }

        // Backward compatibility for existing products.
        return [{
            text: String(product.buttonText || "CONTACT US"),
            link: String(product.buttonLink || "https://discord.com/users/764062307575398431")
        }];
    }

    async function loadProducts() {
        const container = document.getElementById("products-container");

        try {
            const response = await fetch("/api/products", { cache: "no-store" });
            if (!response.ok) throw new Error("Could not load products.");

            const products = await response.json();

            if (!products.length) {
                container.innerHTML = `
                    <div style="grid-column:1/-1;text-align:center;color:#666;padding:70px 0;">
                        No products available right now.
                    </div>`;
                return;
            }

            container.innerHTML = products.map(product => {
                const plans = (product.plans || []).map(plan => `
                    <div class="price-row">
                        <span>${escapeHtml(plan.label)}</span>
                        <span class="price">${escapeHtml(plan.price)}</span>
                    </div>
                `).join("");

                const imageProxy = product.imageUrl ? `/api/image-proxy?url=${encodeURIComponent(product.imageUrl)}` : "";
                const content = product.contentType === "image" && product.imageUrl
                    ? `<div class="pricing image-content"><img src="${escapeHtml(imageProxy)}" data-original="${escapeHtml(product.imageUrl)}" alt="${escapeHtml(product.name)}" onerror="if(this.dataset.tried!=="1"){this.dataset.tried="1";this.src=this.dataset.original;}else{this.style.display='none';this.nextElementSibling.style.display='flex'}"><div class="image-fallback">IMAGE UNAVAILABLE</div></div>`
                    : `<div class="pricing">${plans}</div>`;

                return `
                    <article class="product-card">
                        <div class="product-top">
                            <div class="product-icon">${escapeHtml(product.icon)}</div>
                            <div class="tag">${escapeHtml(product.tag)}</div>
                        </div>

                        <h2>${escapeHtml(product.name)}</h2>

                        <p class="product-description">
                            ${escapeHtml(product.description)}
                        </p>

                        ${content}

                        <div class="product-buttons ${((product.buttons || []).length > 1) ? "two" : ""}">
                            ${getButtons(product).map(button => `
                                <a href="${escapeHtml(button.link)}" class="buy-btn">
                                    ${escapeHtml(button.text)}
                                </a>
                            `).join("")}
                        </div>
                    </article>
                `;
            }).join("");

            document.querySelectorAll(".image-content img").forEach(img => {
                img.addEventListener("click", () => openImageLightbox(img.src || img.dataset.original, img.alt));
            });

        } catch (error) {
            console.error(error);
            container.innerHTML = `
                <div style="grid-column:1/-1;text-align:center;color:#ff4444;padding:70px 0;">
                    Unable to load products.
                </div>`;
        }
    }

    loadProducts();

    // Live product search: filters the products already loaded from the API.
    const productSearch = document.getElementById("productSearch");
    const clearProductSearch = document.getElementById("clearProductSearch");
    const searchStatus = document.getElementById("searchStatus");

    function filterProducts() {
        const query = productSearch.value.trim().toLowerCase();
        const cards = Array.from(document.querySelectorAll("#products-container .product-card"));
        let visible = 0;

        cards.forEach(card => {
            const haystack = card.textContent.toLowerCase();
            const match = !query || haystack.includes(query);
            card.classList.toggle("search-hidden", !match);
            if (match) visible++;
        });

        let empty = document.getElementById("searchNoResults");
        if (query && cards.length && visible === 0) {
            if (!empty) {
                empty = document.createElement("div");
                empty.id = "searchNoResults";
                empty.className = "search-no-results";
                empty.innerHTML = "<strong>No matching product</strong>Try another product name or keyword.";
                document.getElementById("products-container").appendChild(empty);
            }
        } else if (empty) {
            empty.remove();
        }

        clearProductSearch.style.display = query ? "block" : "none";
        searchStatus.textContent = query
            ? `${visible} product${visible === 1 ? "" : "s"} found`
            : "";
    }

    productSearch.addEventListener("input", filterProducts);
    clearProductSearch.addEventListener("click", () => {
        productSearch.value = "";
        productSearch.focus();
        filterProducts();
    });
    
        const imageLightbox=document.getElementById("imageLightbox");
        const lightboxImage=document.getElementById("lightboxImage");
        function openImageLightbox(src,alt){if(!src)return;lightboxImage.src=src;lightboxImage.alt=alt||"Product preview";imageLightbox.classList.add("open");imageLightbox.setAttribute("aria-hidden","false");document.body.classList.add("lightbox-open");}
        function closeImageLightbox(){imageLightbox.classList.remove("open");imageLightbox.setAttribute("aria-hidden","true");document.body.classList.remove("lightbox-open");setTimeout(()=>{lightboxImage.src=""},200)}
        imageLightbox.addEventListener("click",e=>{if(e.target===imageLightbox||e.target.classList.contains("close")||e.target===lightboxImage)closeImageLightbox()});
        document.addEventListener("keydown",e=>{if(e.key==="Escape")closeImageLightbox()});

    </script>
