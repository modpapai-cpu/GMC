<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23050505'/%3E%3Ctext x='32' y='45' text-anchor='middle' font-family='Arial' font-size='42' font-weight='900' fill='%23ff1010'%3EG%3C/text%3E%3C/svg%3E">
<title>GMC — Purchase Logs</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,Helvetica,sans-serif}
body{background:#050505;color:#fff;min-height:100vh}.bg{position:fixed;inset:0;z-index:-1;background:radial-gradient(circle at 15% 20%,rgba(255,0,0,.12),transparent 28%),radial-gradient(circle at 85% 80%,rgba(255,0,0,.09),transparent 30%),#050505}.grid{position:absolute;inset:0;opacity:.15;background-image:linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px);background-size:50px 50px}
nav{height:78px;padding:0 7%;display:flex;align-items:center;justify-content:space-between;background:rgba(5,5,5,.75);backdrop-filter:blur(18px);border-bottom:1px solid rgba(255,0,0,.14)}.logo{color:#fff;text-decoration:none;font-size:21px;font-weight:1000;letter-spacing:1.5px}.nav{display:flex;align-items:center;gap:18px}.nav a{color:#888;text-decoration:none;font-size:11px;font-weight:800}.nav a:hover{color:#fff}.logout{padding:9px 13px;border:1px solid rgba(255,0,0,.35);border-radius:7px;color:#ff3333!important}
.user-info{display:flex;flex-direction:column;align-items:flex-end;gap:3px;margin-right:4px}.user-info #userRole{color:#ff3030;font-size:8px;font-weight:900;letter-spacing:1px}.user-info #userBadge{color:#aaa;font-size:10px;letter-spacing:.2px}
.wrap{width:94%;max-width:1450px;margin:0 auto;padding:55px 0 80px}.top{display:flex;align-items:end;justify-content:space-between;gap:20px;margin-bottom:22px}.eyebrow{color:#ff3030;font-size:10px;font-weight:900;letter-spacing:2px}.top h1{font-size:38px;margin-top:8px}.top p{color:#666;font-size:12px;margin-top:9px}.back{color:#aaa;text-decoration:none;border:1px solid #292929;border-radius:8px;padding:11px 15px;font-size:10px;font-weight:800}.back:hover{border-color:#ff3333;color:#fff}
.search-wrap{margin:0 0 18px;position:relative}.search{width:100%;padding:14px 16px 14px 42px;background:#090909;border:1px solid #252525;border-radius:10px;color:#fff;outline:0;font-size:12px}.search:focus{border-color:#ff3333;box-shadow:0 0 20px rgba(255,0,0,.08)}.search-icon{position:absolute;left:15px;top:50%;transform:translateY(-50%);color:#666;font-size:15px}.count{color:#666;font-size:10px;margin:0 0 12px}
.table-wrap{border:1px solid #222;border-radius:14px;overflow:auto;background:linear-gradient(145deg,rgba(255,0,0,.035),rgba(255,255,255,.012));box-shadow:0 20px 60px rgba(0,0,0,.18)}table{width:100%;min-width:1180px;border-collapse:collapse}th{background:#0c0c0c;color:#ff3030;font-size:9px;letter-spacing:1px;text-align:left;padding:15px 13px;border-bottom:1px solid #292929;white-space:nowrap}td{padding:14px 13px;border-bottom:1px solid #181818;color:#bbb;font-size:10px;vertical-align:top;max-width:230px}tr:last-child td{border-bottom:0}tbody tr:hover{background:rgba(255,0,0,.025)}td.customer{color:#fff;font-weight:800}td.email{color:#aaa}td.credential{font-family:monospace;color:#ddd;word-break:break-all;min-width:120px}.muted{color:#555!important}.date{white-space:nowrap;color:#999}.empty{padding:55px;text-align:center;color:#666}.error{padding:25px;color:#ff5555;text-align:center}
@media(max-width:650px){nav{padding:0 5%}.logo{font-size:15px}.nav{gap:10px}.nav a{font-size:9px}.user-info #userBadge{display:none}.wrap{width:92%;padding-top:40px}.top{align-items:start;flex-direction:column}.top h1{font-size:30px}.back{align-self:stretch;text-align:center}}
</style>
</head>
<body><div class="bg"><div class="grid"></div></div>
<nav><a class="logo" href="admin-dashboard.html">GMC ADMIN</a><div class="nav"><div class="user-info"><span id="userRole">ADMIN</span><span id="userBadge"></span></div><a href="admin-dashboard.html">DASHBOARD</a><a href="#" class="logout" onclick="logout();return false;">LOGOUT</a></div></nav>
<main class="wrap">
<div class="top"><div><div class="eyebrow">ADMIN</div><h1>PURCHASE LOGS</h1><p>View completed GMC purchases and delivered access details.</p></div><a class="back" href="admin-dashboard.html">← BACK TO DASHBOARD</a></div>
<div class="search-wrap"><span class="search-icon">⌕</span><input id="search" class="search" type="search" placeholder="Search customer, email, username, password, licence, product or plan..."></div>
<div id="count" class="count">Loading purchase logs…</div>
<div class="table-wrap"><table><thead><tr><th>CUSTOMER NAME</th><th>EMAIL</th><th>USERNAME</th><th>PASSWORD</th><th>LICENCE</th><th>PRODUCT NAME</th><th>PLAN DETAILS</th><th>PURCHASE DATE</th></tr></thead><tbody id="rows"><tr><td colspan="8" class="empty">Loading…</td></tr></tbody></table></div>
</main>
<script>
const $=id=>document.getElementById(id); let logs=[];
async function api(url,opts={}){const r=await fetch(url,{credentials:'same-origin',...opts});let d={};try{d=await r.json()}catch{}if(!r.ok)throw new Error(d.message||'Request failed.');return d}
function esc(v){return String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
function formatDate(v){if(!v)return '—';const d=new Date(v);if(Number.isNaN(d.getTime()))return '—';return d.toLocaleString('en-IN',{day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'})}
function render(){const q=$('search').value.trim().toLowerCase();const filtered=!q?logs:logs.filter(x=>[x.customerName,x.email,x.username,x.password,x.license,x.productName,x.planDetails,formatDate(x.purchaseDate)].join(' ').toLowerCase().includes(q));$('count').textContent=`${filtered.length} purchase${filtered.length===1?'':'s'} shown${q?' (filtered)':''}`;if(!filtered.length){$('rows').innerHTML='<tr><td colspan="8" class="empty">No purchase logs found.</td></tr>';return}$('rows').innerHTML=filtered.map(x=>`<tr><td class="customer">${esc(x.customerName)||'—'}</td><td class="email">${esc(x.email)||'—'}</td><td class="credential ${x.username?'':'muted'}">${esc(x.username)||'—'}</td><td class="credential ${x.password?'':'muted'}">${esc(x.password)||'—'}</td><td class="credential ${x.license?'':'muted'}">${esc(x.license)||'—'}</td><td>${esc(x.productName)||'—'}</td><td>${esc(x.planDetails)||'—'}</td><td class="date">${esc(formatDate(x.purchaseDate))}</td></tr>`).join('')}
async function init(){try{const status=await api('/api/admin-status');if(!status.authenticated){location.replace('first.html');return}$('userBadge').textContent=status.email||'';$('userRole').textContent=status.role==='super'?'SUPER ADMIN':'ADMIN';const data=await api('/api/purchase-logs');logs=Array.isArray(data.logs)?data.logs:[];render()}catch(e){$('count').textContent='';$('rows').innerHTML=`<tr><td colspan="8" class="error">${esc(e.message||'Unable to load purchase logs.')}</td></tr>`}}
$('search').addEventListener('input',render);async function logout(){try{await fetch('/api/logout',{method:'POST',credentials:'same-origin'})}finally{location.replace('first.html')}}init();
</script></body></html>
